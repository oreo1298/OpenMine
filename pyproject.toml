[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmine"
dynamic = ["version"]
description = "A free and open source Minesweeper that follows your system theme"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "OpenMine contributors" }]
requires-python = ">=3.9"
dependencies = ["PySide6-Essentials>=6.5"]
keywords = ["minesweeper", "game", "puzzle", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Homepage = "https://github.com/oreo1298/OpenMine"
Issues = "https://github.com/oreo1298/OpenMine/issues"

[project.gui-scripts]
openmine = "openmine.app:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "openmine.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmine = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
